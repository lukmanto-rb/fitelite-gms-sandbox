# CI for the squad's work (task 46): runs on every push to a squad branch and on every pull
# request to main. Checks only: type check and build, tests, secret scan, dependency audit.
# There is no deploy workflow; releases go to the local test environment only.
name: CI

on:
  push:
    branches: ['squad/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci --no-audit --no-fund

      - name: Lint and type check
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present && npx tsc --noEmit

      - name: Tests
        if: hashFiles('package.json') != ''
        run: npm test

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Dependency audit (high and critical)
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high
